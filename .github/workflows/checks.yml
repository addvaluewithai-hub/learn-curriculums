name: Production contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/quality.py
      - run: python3 tools/cli.py validate
      # Human-gated Stage 04: real script-contract validation for the four issued B01 lessons.
      - run: python3 tools/cli.py validate --course physics-1-mechanics-waves --lesson phys1-solid-structure-stress-strain --stage script
      - run: python3 tools/cli.py validate --course physics-1-mechanics-waves --lesson phys1-young-axial-stiffness --stage script
      - run: python3 tools/cli.py validate --course physics-1-mechanics-waves --lesson phys1-shear-deformation --stage script
      - run: python3 tools/cli.py validate --course physics-1-mechanics-waves --lesson phys1-bulk-compression --stage script
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: preview-sdk/package-lock.json
      - run: npm ci --prefix preview-sdk
      - run: ./preview-sdk/node_modules/.bin/tsc --project preview-sdk/tsconfig.authoring.json --noEmit
      - run: npm run preview:build
      - run: python3 preview-sdk/tests/prepare_probe.py
      - run: npm run check --prefix preview-sdk
      - run: node preview-sdk/node_modules/vite/bin/vite.js build preview-sdk --config preview-sdk/vite.config.ts
      - run: npx --prefix preview-sdk playwright install --with-deps chromium
      - run: npm run test:browser --prefix preview-sdk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authoring-preview-verification
          path: preview-sdk/test-results/preview-*.png
          if-no-files-found: ignore
